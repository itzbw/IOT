apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground-app
  namespace: argocd
spec:
  project: default
  source:
    # gitlab.local only resolves on the host (/etc/hosts) — pods must use the
    # in-cluster webservice address (workhorse HTTP port 8181) to reach GitLab
    repoURL: http://gitlab-webservice-default.gitlab.svc:8181/root/iot.git
    targetRevision: HEAD
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
