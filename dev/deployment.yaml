apiVersion: apps/v1
kind: Deployment
metadata:
  name: imqandyl-playground
  labels:
    app: playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playground
  template:
    metadata:
      labels:
        app: playground
    spec:
      containers:
        - name: playground
          image: imqandyl/playground:v2
          ports:
            - containerPort: 8888
